<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--cream-100); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card-demo { padding: 18px 20px; }
  .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .count { font-family: var(--font-display); font-size: 36px; line-height: 1; color: var(--fg); }
  .label { font-family: var(--font-sans); font-size: 12px; font-weight: 600; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .delta { font-family: var(--font-sans); font-size: 12px; color: var(--green-600); font-weight: 600; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid var(--border); }
  .row:first-of-type { border-top: 0; }
  .row .name { font-family: var(--font-sans); font-size: 13px; color: var(--fg); }
  .row .val { font-family: var(--font-sans); font-size: 13px; color: var(--fg-muted); font-weight: 600; }
</style></head>
<body>
  <div class="grid">
    <div class="card card-demo">
      <div class="head"><span class="label">Friends</span><span class="delta">+4 this cycle</span></div>
      <div class="count">187</div>
    </div>
    <div class="card card-demo">
      <div class="head"><span class="label">Nuclei</span><span class="delta">+1 this cycle</span></div>
      <div class="count">7</div>
    </div>
    <div class="card card-demo" style="grid-column: span 2">
      <span class="label" style="margin-bottom: 10px; display: block">Core activities</span>
      <div class="row"><span class="name">Study circles</span><span class="val">12</span></div>
      <div class="row"><span class="name">Children's classes</span><span class="val">9</span></div>
      <div class="row"><span class="name">Junior youth groups</span><span class="val">6</span></div>
      <div class="row"><span class="name">Devotional gatherings</span><span class="val">22</span></div>
    </div>
  </div>
</body></html>
