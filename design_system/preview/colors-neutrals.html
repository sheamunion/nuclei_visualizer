<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--cream-100); }
  .row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .swatch { display: flex; flex-direction: column; gap: 6px; }
  .chip { display: block; height: 56px; border-radius: 8px; border: 1px solid var(--border); }
  .name { font-size: 10px; font-weight: 600; color: var(--fg); letter-spacing: 0.04em; text-transform: uppercase; font-family: var(--font-sans); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); }
</style></head>
<body>
  <div class="row">
    <div class="swatch"><span class="chip" style="background:var(--neutral-0); border-color: var(--border-strong)"></span><span class="name">0</span><span class="hex">#FFFFFF</span></div>
    <div class="swatch"><span class="chip" style="background:var(--neutral-100)"></span><span class="name">100</span><span class="hex">#EDEFF3</span></div>
    <div class="swatch"><span class="chip" style="background:var(--neutral-300)"></span><span class="name">300</span><span class="hex">#BFC6D2</span></div>
    <div class="swatch"><span class="chip" style="background:var(--neutral-500)"></span><span class="name">500</span><span class="hex">#6A7383</span></div>
    <div class="swatch"><span class="chip" style="background:var(--neutral-700)"></span><span class="name">700</span><span class="hex">#353C47</span></div>
    <div class="swatch"><span class="chip" style="background:var(--neutral-800)"></span><span class="name">800</span><span class="hex">#21262E</span></div>
    <div class="swatch"><span class="chip" style="background:var(--neutral-900)"></span><span class="name">900</span><span class="hex">#11141A</span></div>
  </div>
</body></html>
