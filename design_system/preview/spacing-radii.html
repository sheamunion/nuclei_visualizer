<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--cream-100); }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .shape { width: 72px; height: 72px; background: var(--indigo-700); }
  .name { font-family: var(--font-sans); font-size: 11px; font-weight: 600; color: var(--fg); letter-spacing: 0.04em; text-transform: uppercase; }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); }
</style></head>
<body>
  <div class="grid">
    <div class="cell"><span class="shape" style="border-radius: 4px"></span><span class="name">xs</span><span class="px">4 px</span></div>
    <div class="cell"><span class="shape" style="border-radius: 8px"></span><span class="name">sm</span><span class="px">8 px</span></div>
    <div class="cell"><span class="shape" style="border-radius: 12px"></span><span class="name">md</span><span class="px">12 px</span></div>
    <div class="cell"><span class="shape" style="border-radius: 16px"></span><span class="name">lg</span><span class="px">16 px</span></div>
    <div class="cell"><span class="shape" style="border-radius: 24px"></span><span class="name">xl</span><span class="px">24 px</span></div>
    <div class="cell"><span class="shape" style="border-radius: 9999px"></span><span class="name">full</span><span class="px">9999</span></div>
  </div>
</body></html>
