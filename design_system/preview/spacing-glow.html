<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 56px 24px; background: radial-gradient(ellipse 70% 80% at 50% 50%, #15294A 0%, #0E2444 55%, #0A1A35 100%); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; place-items: center; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .dot { width: 28px; height: 28px; border-radius: 50%; }
  .green { background: var(--green-300); }
  .gold  { background: var(--gold-300); }
  .name { font-family: var(--font-sans); font-size: 11px; font-weight: 600; color: var(--map-fg); letter-spacing: 0.06em; text-transform: uppercase; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--map-fg-muted); text-align: center; }
</style></head>
<body>
  <div class="grid">
    <div class="cell"><span class="dot green" style="box-shadow: var(--glow-green-sm)"></span><span class="name">Glow / sm</span><span class="meta">Hover · node</span></div>
    <div class="cell"><span class="dot green" style="box-shadow: var(--glow-green-md)"></span><span class="name">Glow / md</span><span class="meta">Engaged · active</span></div>
    <div class="cell"><span class="dot gold"  style="box-shadow: var(--glow-gold-md)"></span><span class="name">Glow / gold</span><span class="meta">Sustaining nucleus</span></div>
    <div class="cell"><span class="dot green" style="box-shadow: var(--glow-green-lg)"></span><span class="name">Glow / lg</span><span class="meta">High-activity nucleus</span></div>
  </div>
</body></html>
