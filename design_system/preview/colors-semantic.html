<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--cream-100); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .tile { display: flex; gap: 16px; align-items: center; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--cream-50); }
  .dot { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; }
  .info { display: flex; flex-direction: column; gap: 2px; }
  .name { font-family: var(--font-sans); font-size: 13px; font-weight: 600; color: var(--fg); }
  .meaning { font-family: var(--font-sans); font-size: 12px; color: var(--fg-muted); }
</style></head>
<body>
  <div class="grid">
    <div class="tile">
      <span class="dot" style="background: var(--green-500); box-shadow: var(--glow-green-sm)"></span>
      <div class="info"><span class="name">Engaged</span><span class="meaning">Active in a core activity</span></div>
    </div>
    <div class="tile">
      <span class="dot" style="background: var(--gold-500); box-shadow: var(--glow-gold-sm)"></span>
      <div class="info"><span class="name">Sustaining</span><span class="meaning">Sustaining a core activity</span></div>
    </div>
    <div class="tile">
      <span class="dot" style="background: var(--cream-100); border: 1px solid var(--border-strong)"></span>
      <div class="info"><span class="name">Invited</span><span class="meaning">Invited, not yet engaged</span></div>
    </div>
    <div class="tile">
      <span class="dot" style="background: var(--neutral-300)"></span>
      <div class="info"><span class="name">Not yet invited</span><span class="meaning">Known, awaiting invitation</span></div>
    </div>
  </div>
</body></html>
