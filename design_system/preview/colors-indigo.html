<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--cream-100); }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .swatch { display: flex; flex-direction: column; gap: 6px; }
  .chip { display: block; height: 64px; border-radius: 10px; border: 1px solid var(--border); }
  .name { font-size: 11px; font-weight: 600; color: var(--fg); letter-spacing: 0.04em; text-transform: uppercase; font-family: var(--font-sans); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); }
</style></head>
<body>
  <div class="row">
    <div class="swatch"><span class="chip" style="background:var(--indigo-50)"></span><span class="name">Indigo 50</span><span class="hex">#EEF2F8</span></div>
    <div class="swatch"><span class="chip" style="background:var(--indigo-200)"></span><span class="name">Indigo 200</span><span class="hex">#B2C0D9</span></div>
    <div class="swatch"><span class="chip" style="background:var(--indigo-400)"></span><span class="name">Indigo 400</span><span class="hex">#5A7298</span></div>
    <div class="swatch"><span class="chip" style="background:var(--indigo-700)"></span><span class="name">Indigo 700</span><span class="hex">#1F3A5F</span></div>
    <div class="swatch"><span class="chip" style="background:var(--indigo-900)"></span><span class="name">Indigo 900</span><span class="hex">#0E2444</span></div>
    <div class="swatch"><span class="chip" style="background:var(--indigo-950)"></span><span class="name">Indigo 950</span><span class="hex">#0A1A35</span></div>
  </div>
</body></html>
