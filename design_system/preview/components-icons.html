<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--cream-100); }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 16px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .icon-wrap { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); border-radius: 10px; background: var(--cream-50); color: var(--indigo-800); }
  .name { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); }
  svg { width: 22px; height: 22px; }
</style></head>
<body>
  <div class="grid">
    <div class="cell"><div class="icon-wrap"><img src="../assets/icons/plus.svg" alt=""></div><span class="name">plus</span></div>
    <div class="cell"><div class="icon-wrap"><img src="../assets/icons/plus-circle.svg" alt=""></div><span class="name">plus-circle</span></div>
    <div class="cell"><div class="icon-wrap"><img src="../assets/icons/search.svg" alt=""></div><span class="name">search</span></div>
    <div class="cell"><div class="icon-wrap"><img src="../assets/icons/filter.svg" alt=""></div><span class="name">filter</span></div>
    <div class="cell"><div class="icon-wrap"><img src="../assets/icons/person.svg" alt=""></div><span class="name">person</span></div>
    <div class="cell"><div class="icon-wrap"><img src="../assets/icons/people.svg" alt=""></div><span class="name">people</span></div>
    <div class="cell"><div class="icon-wrap"><img src="../assets/icons/nucleus.svg" alt=""></div><span class="name">nucleus</span></div>
    <div class="cell"><div class="icon-wrap"><img src="../assets/icons/path.svg" alt=""></div><span class="name">path</span></div>
    <div class="cell"><div class="icon-wrap"><img src="../assets/icons/sparkle.svg" alt=""></div><span class="name">sparkle</span></div>
    <div class="cell"><div class="icon-wrap"><img src="../assets/icons/star.svg" alt=""></div><span class="name">star</span></div>
    <div class="cell"><div class="icon-wrap"><img src="../assets/icons/home.svg" alt=""></div><span class="name">home</span></div>
    <div class="cell"><div class="icon-wrap"><img src="../assets/icons/map.svg" alt=""></div><span class="name">map</span></div>
    <div class="cell"><div class="icon-wrap"><img src="../assets/icons/chart.svg" alt=""></div><span class="name">chart</span></div>
